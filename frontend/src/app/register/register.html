<div class="register-container">
  <div class="register-box">
    <h1 class="title">Registrarse</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group input-group--arcade">
        <label for="register-name">Nombre arcade (3 letras)</label>
        <input
          id="register-name"
          type="text"
          name="name"
          maxlength="3"
          autocapitalize="characters"
          autocomplete="username"
          placeholder="Ej: JAX"
          title="Exactamente tres letras, como en los marcadores arcade"
          pattern="[A-Za-z]{3}"
          [(ngModel)]="form.name"
          [class.valid]="isValid('name')"
          [class.invalid]="isInvalid('name')"
          required
        />
        <span class="error">{{ fieldErrors().name }}</span>
        <small class="input-hint">Solo letras de la A a la Z, tres caracteres en mayúsculas.</small>
      </div>

      <div class="input-group">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="Introduce tu email"
          [(ngModel)]="form.email"
          [class.valid]="isValid('email')"
          [class.invalid]="isInvalid('email')"
          required
        />
        <span class="error">{{ fieldErrors().email }}</span>
      </div>

      <div class="input-group">
        <label for="register-password">Contraseña</label>
        <input
          id="register-password"
          type="password"
          name="password"
          autocomplete="new-password"
          placeholder="8 caracteres, mayúscula, minúscula y número"
          [(ngModel)]="form.password"
          [class.valid]="isValid('password')"
          [class.invalid]="isInvalid('password')"
          required
          minlength="8"
        />
        <span class="error">{{ fieldErrors().password }}</span>
      </div>

      <div class="input-group">
        <label for="register-password-confirm">Confirmar contraseña</label>
        <input
          id="register-password-confirm"
          type="password"
          name="passwordConfirm"
          autocomplete="new-password"
          placeholder="Repite la contraseña"
          [(ngModel)]="form.passwordConfirm"
          [class.valid]="isValid('passwordConfirm')"
          [class.invalid]="isInvalid('passwordConfirm')"
          required
        />
        <span class="error">{{ fieldErrors().passwordConfirm }}</span>
      </div>

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'REGISTRANDO...' : 'REGISTRARSE' }}
      </button>
    </form>

    @if (errorMessage()) {
      <div class="error-message" role="alert">
        {{ errorMessage() }}
      </div>
    }
    <p class="footer footer--compact">Has cambiado de opinión? <a routerLink="/">Volver al Homepage</a></p>
  </div>
</div>
