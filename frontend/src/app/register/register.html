<div class="register-container">
  <div class="register-box">
    <h1 class="title">Registrarse</h1>

    <form>
      <div class="input-group">
        <label>Nombre de usuario</label>
        <input type="text" placeholder="Introduce tu nombre de usuario" />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="text" placeholder="Introduce tu email" />
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Introduce tu contraseña" />
      </div>

      <div class="input-group">
        <label>Confirmar Contraseña</label>
        <input type="password" placeholder="Introduce tu contraseña de nuevo" />
      </div>

      <button type="submit">REGISTRARSE</button>

      <p class="footer">Has cambiado de opinión? <a routerLink="/">Volver al Homepage</a></p>
    </form>
  </div>
</div>
